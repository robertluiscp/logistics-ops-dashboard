# Sobe so' o PostgreSQL para desenvolvimento local.
#   docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:-logistics_ops}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?defina PGPASSWORD no .env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
